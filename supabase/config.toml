# supabase/config.toml
# Supabase CLI project configuration.
# There is no CI database job: migrations are applied from agent/CLI sessions that
# target a project ref directly (Supabase MCP `project_id` param, or `supabase link`).
# project_id below is the DEV project ref — not a secret (identifier, not credential).
# Never link/push to the production ref from a dev machine without an explicit ticket.
project_id = "iymwxdewcpvpjgzewtzk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://tevd-portal.vercel.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Production project: ynykjpnetfwqzdnsgkkg
# Development project: iymwxdewcpvpjgzewtzk
