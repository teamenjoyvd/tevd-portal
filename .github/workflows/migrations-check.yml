# PR-time migration validation (#570): replay every migration from scratch on a
# disposable local Supabase stack. Catches ordering/SQL errors before merge.
# Runs on every PR and reports success immediately when supabase/** is
# untouched — a required status check must always report, or non-schema PRs
# hang forever on "Expected".
name: Migrations Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: migrations-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay migrations from scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect supabase changes
        id: diff
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^supabase/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No supabase/ changes — replay skipped, check passes."
          fi
      - uses: supabase/setup-cli@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          version: latest
      - name: Start local Supabase and replay all migrations
        if: steps.diff.outputs.changed == 'true'
        run: |
          supabase start
          supabase db reset
      - name: Lint database schema
        if: steps.diff.outputs.changed == 'true'
        run: supabase db lint --level error
