# PR-time migration validation (#570): replay every migration from scratch on a
# disposable local Supabase stack. Catches ordering/SQL errors before merge.
# Runs on every PR and reports success immediately when supabase/** is
# untouched — a required status check must always report, or non-schema PRs
# hang forever on "Expected".
# Draft PRs skip every job: drafts are checked locally (npm run verify:ci, the
# .githooks/pre-push gate) and CI runs once when the PR is marked ready.
# A job skipped by `if:` reports success, so required checks never hang on
# "Expected"; on push to main `pull_request` is null and the condition holds.
name: Migrations Check

on:
  pull_request:
    branches: [main]
    # Listing types replaces the defaults, so the defaults are spelled out.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: migrations-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay migrations from scratch
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect supabase changes
        id: diff
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^supabase/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No supabase/ changes — replay skipped, check passes."
          fi
      # Keeps image-pull connections off Supabase's fixed host ports, which sit in
      # the ephemeral range; reasoning in ci.yml "Reserve Supabase ports".
      - name: Reserve Supabase ports from the ephemeral range
        if: steps.diff.outputs.changed == 'true'
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          echo "ephemeral range: $(cat /proc/sys/net/ipv4/ip_local_port_range)"
      - uses: supabase/setup-cli@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          # Pinned, never `latest` (#781). Same version in all three workflows.
          version: 2.122.1
      - name: Start local Supabase and replay all migrations
        if: steps.diff.outputs.changed == 'true'
        run: |
          supabase start
          supabase db reset
      - name: Lint database schema
        if: steps.diff.outputs.changed == 'true'
        run: supabase db lint --level error
