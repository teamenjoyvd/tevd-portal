name: Preview Smoke

# Runs the Playwright smoke against each Vercel PREVIEW deployment once
# Vercel reports it ready: public-route navigation plus one real guest flow
# (e2e/library-guide.spec.ts). Previews use the DEV Supabase project
# (Pre-Production-scoped Vercel env vars) since 2026-07-16.
#
# Advisory-only for now: deployment_status-triggered runs are not attached
# to the PR as required checks by default. Once trusted, add the "smoke"
# job as a required status check in branch protection.

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-smoke-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    name: 390px smoke vs preview
    if: >
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # e2e/calendar.spec.ts asserts the CURRENT Sofia month has at least one
      # guest-visible event, and fails loudly rather than skipping when it does
      # not. DEV held no rolling fixture, so the check expired the moment Sofia
      # crossed into a new month (2026-07-31T21:00Z). This step renews it on
      # every preview instead.
      #
      # The URL is built from SUPABASE_PROJECT_ID_DEV, never from a secret that
      # could carry a prod host: the script refuses any project ref but DEV, so
      # a mis-scoped service-role key fails the step instead of writing to prod.
      - name: Seed the DEV calendar smoke fixture
        run: npm run seed:smoke-calendar
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID_DEV }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # VERCEL_AUTOMATION_BYPASS_SECRET: Vercel project -> Settings ->
      # Deployment Protection -> Protection Bypass for Automation, mirrored
      # into GitHub Actions secrets. Without it, deployment protection (SSO)
      # serves a vercel.com login page and the spec's origin assertion fails
      # — the run never passes vacuously.
      - run: npx playwright test --project=mobile-390
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
